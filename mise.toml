[tools]
node = "26.13.0"
pnpm = "12.18.0"
biome = "2.6.7"
stylua = "2.6.0"
shellcheck = "0.11.0"
neovim = "0.12.6"
java = "temurin-21"
gradle = "9.8.2"

[env]
_.path = ["node_modules/.bin"]

[tasks.install]
description = "install the pinned dev dependencies"
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "write every generated file from palette.json"
depends = ["install"]
run = "node src/build.ts"

[tasks.check]
description = "fail when a committed generated file differs from the build"
run = "node src/build.ts --check"

[tasks.test]
description = "test the palette, the generated files and the neovim plugin"
run = ["node --test tests/*.test.ts", "python3 scripts/test-jetbrains-icon-colors.py", "python3 scripts/test-jetbrains-icon-package.py", "nvim -l tests/nvim/run.lua"]

[tasks.lint]
description = "lint typescript, lua and shell, and check formatting and types"
depends = ["install"]
run = ["biome check --error-on-warnings", "stylua --check .", "shellcheck scripts/validate.sh", "tsc"]

[tasks.format]
description = "format typescript, json and lua in place"
run = ["biome check --write", "stylua ."]

[tasks.validate]
description = "check generated themes with the tools that read them"
run = "sh scripts/validate.sh"

[tasks.vscode]
description = "package the vs code extension into dist/"
depends = ["build"]
run = [
  "rm -rf dist/vscode && mkdir -p dist && cp -R themes/vscode dist/vscode && cp assets/icon.png dist/vscode/",
  "cd dist/vscode && vsce package --no-dependencies --out ..",
]

[tasks.jetbrains]
description = "package the jetbrains theme plugin and the editor scheme into dist/"
run = [
  { task = "build" },
  "mkdir -p dist/jetbrains/sotto/lib",
  "cd themes/jetbrains && zip -FS -X -q -r ../../dist/jetbrains/sotto/lib/sotto.jar LICENSE NOTICE META-INF/plugin.xml META-INF/pluginIcon.svg sotto.theme.json sotto.xml sotto-black.theme.json sotto-black.xml icons",
  "cd dist/jetbrains && zip -FS -X -q -r ../sotto-jetbrains.zip sotto",
  "cp themes/jetbrains/sotto.xml dist/sotto.icls",
  "cp themes/jetbrains/sotto-black.xml dist/sotto-black.icls",
]

[tasks.ci]
description = "run everything continuous integration runs"
run = [{ task = "lint" }, { task = "check" }, { task = "test" }, { task = "validate" }]

[tasks."jetbrains:local"]
description = "package the theme with the installed intellij icon library in sotto colors, local only: it holds recolored jetbrains artwork"
run = "node src/jetbrains-local.ts"

[tasks."jetbrains:icons"]
description = "build the sotto icons plugin for jetbrains ides into dist/"
depends = ["build"]
dir = "jetbrains-icons"
run = ["rm -rf build/distributions", "gradle --console=plain buildPlugin", "mkdir -p ../dist && cp build/distributions/sotto-icons-*.zip ../dist/"]

[tasks."jetbrains:icons:check"]
description = "test the sotto icons plugin and verify it against the supported ides"
depends = ["build"]
dir = "jetbrains-icons"
run = "gradle --console=plain test verifyPlugin"

[tasks.sheet]
description = "render assets/icons.png from the generated icons, needs imagemagick"
run = "node src/sheet.ts"
