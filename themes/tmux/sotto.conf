set -g dark-theme-black "#000000"
set -g dark-theme-white "#dcdae7"
set -g dark-theme-light-grey "#5f5b67"
set -g dark-theme-dark-grey "#181818"
set -g dark-theme-red "#d47a80"
set -g dark-theme-green "#96bba6"
set -g dark-theme-yellow "#deb775"
set -g dark-theme-blue "#9dabc8"
set -g dark-theme-magenta "#c6b7d7"
set -g dark-theme-cyan "#b1cbc3"
set -g status-style "fg=#9d9bad,bg=default"
set -g window-status-current-style "fg=#dda9a9,bold"
