[mgr]
cwd = { fg = "#dcdae7" }
find_keyword = { fg = "#dda9a9", bold = true }
find_position = { fg = "#9d9bad" }
symlink_target = { fg = "#8f8c9e" }
marker_selected = { fg = "#dda9a9", bg = "#1f1f1f" }
marker_copied = { fg = "#96bba6", bg = "#1f1f1f" }
marker_cut = { fg = "#d47a80", bg = "#1f1f1f" }
marker_marked = { fg = "#c6b7d7", bg = "#1f1f1f" }
border_style = { fg = "#5f5b67" }
count_selected = { fg = "#000000", bg = "#dda9a9" }
count_copied = { fg = "#000000", bg = "#96bba6" }
count_cut = { fg = "#000000", bg = "#d47a80" }
syntect_theme = "~/.config/bat/themes/hush.tmTheme"

[indicator]
